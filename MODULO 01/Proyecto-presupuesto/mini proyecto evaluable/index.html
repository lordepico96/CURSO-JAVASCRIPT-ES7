
<!DOCTYPE html>
<!--
    Indica al navegador que estamos utilizando HTML5.
-->

<html lang="es">
<!--
    Es el elemento principal del documento HTML.
    lang="es" indica que el idioma es español.
-->

<head>
    <!--
        HEAD:
        Contiene información de configuración de la página.
        Esta información normalmente no se muestra
        directamente al usuario.
    -->

    <meta charset="UTF-8">
    <!--
        Permite utilizar caracteres especiales como:
        ñ, tildes, símbolos y signos.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        Permite que la página se adapte al tamaño
        de la pantalla del dispositivo.
    -->

    <title>Mini proyecto evaluable - Conversor de unidades</title>
    <!--
        Define el título que aparece en la pestaña
        del navegador.
    -->

</head>

<body>
    <!--
        BODY:
        Contiene los elementos visibles de la página web.
    -->

    <h1>Conversor de unidades</h1>
    <!--
        H1:
        Es el título principal de nuestra página.
    -->

    <h2>Mini proyecto evaluable - Módulo I</h2>
    <!--
        H2:
        Es un subtítulo que identifica el proyecto.
    -->

    <p>
        Programa desarrollado con JavaScript para convertir
        unidades de temperatura y longitud.
    </p>
    <!--
        P:
        Permite escribir un párrafo descriptivo.
    -->

    <p>
        Las conversiones se realizan mediante un menú
        interactivo de JavaScript.
    </p>
    <!--
        El menú aparecerá mediante prompt().
        Los resultados se mostrarán mediante alert().
        Estas funciones se programarán en MNPE.js.
    -->

    <script src="MNPE.js"></script>
    <!--
        SCRIPT:
        Permite conectar un archivo JavaScript externo
        con nuestro documento HTML.

        SRC:
        Indica la ubicación del archivo JavaScript.

        MNPE.js:
        Es el archivo donde programaremos:

        1. Las cuatro funciones de conversión.
        2. El menú de opciones.
        3. La estructura switch.
        4. Las validaciones de los datos.
        5. El ciclo para repetir las conversiones.
        6. La opción para finalizar el programa.

        Colocamos SCRIPT al final del BODY para que
        el navegador procese primero el contenido HTML.
    -->

</body>
</html>
